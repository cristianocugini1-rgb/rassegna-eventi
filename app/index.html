<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eventi attorno a Parma</title>
<meta name="theme-color" content="#131419">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icona-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eventi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --nero:#131419; --carta:#1c1d24; --carta2:#24262f; --bianco:#f4f4f2; --tenue:#9a9ca6;
    --linea:rgba(255,255,255,.14); --accento:#2ec4a0; --punto:#e4405f;
    --serif:"Fraunces", Georgia, "Times New Roman", serif;
    --sans:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { overflow-x:hidden; }
  body { margin:0; background:radial-gradient(120% 80% at 80% 0%, #1a1424 0%, #0d0d12 55%) fixed, #0d0d12; color:var(--bianco); font:16px/1.5 var(--sans); }
  a { color:inherit; }
  button { font-family:inherit; }
  .etichetta { font-size:.7rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--accento); }
  .pillola { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--linea); border-radius:999px;
             padding:8px 15px; font-size:.9rem; color:var(--bianco); background:transparent; text-decoration:none;
             white-space:nowrap; cursor:pointer; }
  .pillola.piena { background:var(--bianco); color:var(--nero); border-color:var(--bianco); font-weight:700; }
  .pillola.verde { border-color:var(--accento); }

  /* apertura con i cerchi della distanza */
  .apertura { padding:calc(env(safe-area-inset-top) + 18px) 20px 4px; text-align:center; }
  .marchio { display:flex; justify-content:space-between; align-items:center; text-align:left; }
  .marchio b { font-size:1rem; letter-spacing:.32em; font-weight:800; }
  .marchio span { font-size:.78rem; color:var(--tenue); }
  .cerchi { position:relative; width:min(88vw, 400px); aspect-ratio:220/232; margin:12px auto 0; }
  .cerchi svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .cerchi circle.anello { fill:none; stroke:rgba(255,255,255,.26); stroke-width:1; cursor:pointer; transition:stroke .2s; }
  .cerchi circle.anello.scelto { stroke:var(--accento); stroke-width:1.6; }
  .cerchi text { fill:var(--tenue); font-size:10px; text-anchor:middle; font-family:var(--sans); cursor:pointer; }
  .cerchi text.scelto { fill:var(--accento); font-weight:800; }
  .cerchi h1 { position:absolute; inset:0 0 5% 0; margin:auto; height:max-content; pointer-events:none;
               font:400 clamp(2rem, 9vw, 2.8rem)/1.02 var(--serif); letter-spacing:-.02em; }
  .cerchi h1 i { color:var(--accento); }
  .numeri { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:6px 0 2px; }
  .numeri .pillola b { font-size:1rem; }
  .aggiornato { font-size:.74rem; color:var(--tenue); margin:10px 0 0; }

  /* barra sottile con i menu a tendina */
  .barra { position:sticky; top:0; z-index:20; background:rgba(19,20,25,.9); backdrop-filter:blur(12px);
           -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--linea);
           padding:calc(env(safe-area-inset-top) * .4 + 10px) 14px 10px; }
  .barra .file { display:flex; gap:8px; max-width:760px; margin:0 auto; }
  .tendina { flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:1px; text-align:left;
             background:var(--carta); border:1px solid var(--linea); border-radius:14px; padding:7px 34px 7px 13px;
             color:var(--bianco); cursor:pointer; position:relative; }
  .tendina small { font-size:.62rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--tenue); }
  .tendina span { font-size:.92rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .tendina::after { content:""; position:absolute; right:13px; top:50%; width:7px; height:7px; margin-top:-5px;
                    border-right:1.6px solid var(--tenue); border-bottom:1.6px solid var(--tenue); transform:rotate(45deg);
                    transition:transform .2s; }
  .tendina[aria-expanded=true] { border-color:var(--accento); }
  .tendina[aria-expanded=true]::after { transform:rotate(225deg); margin-top:-1px; border-color:var(--accento); }
  .tendina.attiva span { color:var(--accento); }
  .lente { flex:0 0 48px; border-radius:14px; border:1px solid var(--linea); background:var(--carta); cursor:pointer;
           display:grid; place-items:center; color:var(--bianco); }
  .lente[aria-expanded=true], .lente.attiva { border-color:var(--accento); color:var(--accento); }
  .cerca { max-width:760px; margin:8px auto 0; display:none; }
  .cerca.aperta { display:block; }
  .cerca input { width:100%; padding:11px 16px; border-radius:14px; border:1px solid var(--linea); background:var(--carta);
                 color:var(--bianco); font:500 1rem var(--sans); }
  .cerca input::placeholder { color:var(--tenue); }

  .pannello { position:absolute; left:14px; right:14px; top:calc(100% + 6px); max-width:760px; margin:0 auto;
              background:#1f2028; border:1px solid var(--linea); border-radius:18px; padding:8px;
              box-shadow:0 18px 50px rgba(0,0,0,.55); max-height:60vh; overflow-y:auto;
              opacity:0; transform:translateY(-6px); pointer-events:none; transition:opacity .18s, transform .18s; }
  .pannello.aperto { opacity:1; transform:none; pointer-events:auto; }
  .voce { display:flex; align-items:center; gap:12px; width:100%; background:none; border:0; color:var(--bianco);
          padding:11px 12px; border-radius:12px; font-size:.98rem; cursor:pointer; text-align:left; }
  .voce:hover { background:rgba(255,255,255,.05); }
  .voce .ic { width:26px; text-align:center; font-size:1.05rem; }
  .voce .n { margin-left:auto; font-size:.8rem; color:var(--tenue); }
  .voce[aria-selected=true] { background:rgba(46,196,160,.12); color:var(--accento); font-weight:700; }
  .voce[aria-selected=true] .n { color:var(--accento); }

  main { padding:0 16px calc(env(safe-area-inset-bottom) + 40px); max-width:760px; margin:0 auto; }
  section { margin-top:32px; }
  section > .etichetta { display:block; margin-bottom:4px; }
  section > h2 { margin:0 0 14px; font:400 1.9rem/1.1 var(--serif); letter-spacing:-.01em; }

  /* in evidenza */
  .scorri { display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -16px; padding:0 16px 6px; scrollbar-width:none; }
  .scorri::-webkit-scrollbar { display:none; }
  .grande { flex:0 0 80%; max-width:340px; scroll-snap-align:start; background:var(--carta); border-radius:20px; overflow:hidden;
            cursor:pointer; border:0; padding:0; text-align:left; color:var(--bianco); }
  .grande .img { position:relative; aspect-ratio:4/3; background:var(--carta2); }
  .grande img { width:100%; height:100%; object-fit:cover; display:block; }
  .grande .tag { position:absolute; top:12px; right:12px; background:rgba(19,20,25,.6); backdrop-filter:blur(6px);
                 -webkit-backdrop-filter:blur(6px); font-size:.64rem; font-weight:800; letter-spacing:.12em;
                 text-transform:uppercase; padding:7px 12px; border-color:rgba(255,255,255,.5); }
  .grande .testo { padding:14px 16px 18px; }
  .grande .quando { font-size:.72rem; color:var(--accento); font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
  .grande h3 { margin:6px 0 4px; font:400 1.3rem/1.2 var(--serif); }
  .grande .dove { font-size:.86rem; color:var(--tenue); }

  /* giorni a tendina */
  details.giorno { border-top:1px solid var(--linea); }
  details.giorno:last-of-type { border-bottom:1px solid var(--linea); }
  details.giorno > summary { list-style:none; display:flex; align-items:center; gap:12px; padding:16px 2px; cursor:pointer; }
  details.giorno > summary::-webkit-details-marker { display:none; }
  .g-nome { flex:1; min-width:0; }
  .g-nome h3 { margin:0; font:400 1.55rem/1.1 var(--serif); letter-spacing:-.01em; }
  .g-nome .etichetta { color:var(--tenue); display:block; margin-top:3px; }
  details.giorno.oggi .g-nome .etichetta { color:var(--accento); }
  .anteprime { display:flex; }
  .anteprime img, .anteprime span { width:30px; height:30px; border-radius:50%; object-fit:cover; border:2px solid var(--nero);
                                    margin-left:-9px; background:var(--carta2); }
  .anteprime span { display:grid; place-items:center; font-size:.7rem; font-weight:800; color:var(--bianco); }
  .apri { flex:0 0 34px; height:34px; border-radius:50%; border:1px solid var(--linea); display:grid; place-items:center; transition:transform .25s; }
  details[open] > summary .apri { transform:rotate(180deg); border-color:var(--accento); color:var(--accento); }
  .contenuto { padding:0 0 10px; animation:scendi .25s ease; }
  @keyframes scendi { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }

  /* scheda evento */
  .ev { background:var(--carta); border-radius:16px; margin:0 0 8px; overflow:hidden; }
  .ev > button { all:unset; box-sizing:border-box; display:flex; gap:13px; width:100%; padding:10px; cursor:pointer; align-items:center; }
  .ev .foto, .ev .segnaposto { flex:0 0 58px; height:58px; border-radius:12px; object-fit:cover; background:var(--carta2); }
  .ev .segnaposto { display:grid; place-items:center; font-size:1.3rem; }
  .ev .corpo { flex:1; min-width:0; }
  .ev .cat { font-size:.64rem; font-weight:800; letter-spacing:.13em; text-transform:uppercase; color:var(--tenue); }
  .ev .tit { font-size:1rem; font-weight:700; line-height:1.3; margin:2px 0; overflow-wrap:anywhere;
             display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .ev .dove { font-size:.83rem; color:var(--tenue); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev .dove b { color:var(--bianco); font-weight:700; }
  .ev.aperta .tit { -webkit-line-clamp:unset; }
  .dettagli { display:none; padding:2px 14px 16px; }
  .ev.aperta .dettagli { display:block; animation:scendi .25s ease; }
  .dettagli img { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:14px; margin-bottom:12px; }
  .dettagli p { margin:0 0 12px; color:#d7d8dc; line-height:1.6; overflow-wrap:anywhere; font-size:.95rem; }
  .dettagli .sott { font:italic 400 1.05rem/1.4 var(--serif); color:var(--bianco); }
  .info { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .info span { border:1px solid var(--linea); border-radius:999px; padding:4px 11px; font-size:.76rem; color:var(--tenue); }
  .azioni { display:flex; gap:8px; flex-wrap:wrap; }

  details.lunghi { margin-top:36px; }
  details.lunghi > summary { list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center;
                             gap:12px; padding:18px 20px; border:1px solid var(--linea); border-radius:20px; }
  details.lunghi > summary::-webkit-details-marker { display:none; }
  details.lunghi > summary h2 { margin:4px 0 0; font:400 1.4rem/1.15 var(--serif); }
  details.lunghi[open] > summary { margin-bottom:10px; }

  .cal { background:rgba(24,25,32,.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
         border:1px solid var(--linea); border-radius:24px; padding:16px 14px 14px; }
  .cal-testa { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-testa h3 { margin:0; font:400 1.5rem/1 var(--serif); text-transform:capitalize; }
  .cal-freccia { width:38px; height:38px; border-radius:50%; border:1px solid var(--linea); background:transparent;
                 color:var(--bianco); font-size:1.4rem; line-height:1; cursor:pointer; }
  .cal-freccia:disabled { opacity:.25; cursor:default; }
  .cal-griglia { display:grid; grid-template-columns:repeat(7, 1fr); gap:5px; }
  .cal-sett { text-align:center; font-size:.62rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
              color:var(--tenue); padding-bottom:4px; }
  .cella { aspect-ratio:1; border-radius:13px; display:flex; flex-direction:column; align-items:center; justify-content:center;
           gap:2px; border:1px solid transparent; background:none; color:var(--bianco); padding:0; }
  .cella b { font-size:1rem; font-weight:700; }
  .cella i { font-style:normal; font-size:.6rem; font-weight:800; color:var(--accento); }
  .cella.vuota b { font-weight:400; color:rgba(255,255,255,.26); }
  .cella.fuori { visibility:hidden; }
  .cella.con { background:rgba(255,255,255,.06); cursor:pointer; }
  .cella.oggi { border-color:var(--accento); }
  .cella.scelta { background:linear-gradient(135deg, #ffe14d 0%, #ffb627 45%, #45f0b8 100%); border-color:transparent;
                  box-shadow:0 6px 22px rgba(255,190,40,.35); }
  .cella.scelta b, .cella.scelta i { color:#14131a; }
  .scelto-testa { margin:22px 2px 12px; }
  .scelto-testa h3 { margin:0; font:400 1.6rem/1.1 var(--serif); }
  .scelto-testa .etichetta { display:block; margin-top:3px; }
  .ev { background:rgba(28,29,37,.82); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  body::after { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
                background:linear-gradient(90deg, transparent 0%, rgba(13,13,18,.55) 22%, rgba(13,13,18,.62) 50%, rgba(13,13,18,.55) 78%, transparent 100%); }
  .etichetta, .marchio, .aggiornato, section > h2, .scelto-testa h3 { text-shadow:0 1px 10px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.8); }
  #cristalli { position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; opacity:.85; }
  .vuoto { text-align:center; color:var(--tenue); padding:60px 20px; }
  .vuoto h2 { color:var(--bianco); font:400 1.6rem var(--serif); }
  footer { font-size:.74rem; color:var(--tenue); text-align:center; padding:0 24px 34px; max-width:600px; margin:0 auto; }
</style>
</head>
<body>
<header class="apertura">
  <div class="marchio"><b>EVENTI</b><span id="dove-centro">Parma · 100 km</span></div>
  <div class="cerchi" aria-label="Scegli la distanza toccando un cerchio">
    <svg viewBox="-110 -108 220 232" aria-hidden="true" id="anelli"></svg>
    <h1>Cosa succede<br>attorno a <i>Parma</i></h1>
  </div>
  <div class="numeri">
    <button class="pillola" data-q="oggi"><b id="n-oggi">·</b> oggi</button>
    <button class="pillola" data-q="weekend"><b id="n-weekend">·</b> nel weekend</button>
    <button class="pillola" data-q="30"><b id="n-mese">·</b> in 30 giorni</button>
  </div>
  <p class="aggiornato" id="info">Caricamento...</p>
</header>

<div class="barra" id="barra">
  <div class="file">
    <button class="tendina" id="t-quando" aria-haspopup="listbox" aria-expanded="false"><small>Quando</small><span id="v-quando">30 giorni</span></button>
    <button class="tendina" id="t-cat" aria-haspopup="listbox" aria-expanded="false"><small>Categoria</small><span id="v-cat">Tutte</span></button>
    <button class="lente" id="t-cerca" aria-expanded="false" aria-label="Cerca">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
  </div>
  <div class="cerca" id="box-cerca"><input type="search" id="cerca" placeholder="Cerca: sagra, jazz, Reggio..." aria-label="Cerca eventi"></div>
  <div class="pannello" id="p-quando" role="listbox" aria-label="Quando"></div>
  <div class="pannello" id="p-cat" role="listbox" aria-label="Categoria"></div>
</div>

<main id="lista"></main>
<footer id="piede"></footer>

<script>
const ICONA = {
  "Musica":"♪", "Opera, teatro e danza":"🎭", "Mostre ed Arte":"🖼", "Eventi enogastronomici":"🍷",
  "Mercatini e Mostre Mercato":"🛍", "Natale / Mercati di Natale":"🎄", "Escursioni e Visite guidate":"🥾",
  "Eventi sportivi":"🏃", "Serate e nightlife":"🌙", "Per bambini":"🧸", "Cinema":"🎬", "Festival":"🎪",
  "Incontri e libri":"📚", "Fiere & Congressi":"🏛", "Spettacoli di strada e tradizioni":"🎪",
};
const icona = c => ICONA[c] || "✦";
const QUANDO = [["oggi","Oggi","☀"],["domani","Domani","→"],["weekend","Questo weekend","✶"],
                ["7","Prossimi 7 giorni","7"],["30","Prossimi 30 giorni","30"],["tutto","Tutto il calendario","∞"]];
const RAGGI = [10, 25, 50, 100];
const stato = { quando:"30", categoria:null, raggio:100, testo:"", scelto:null, mese:null };
let DATI = null;

const giorno = s => { const d = new Date(s + "T12:00:00"); d.setHours(0,0,0,0); return d; };
const OGGI = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const piu = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const breve = (d, o) => d.toLocaleDateString("it-IT", o).replace(".", "");
const NASCONDI = "this.style.visibility='hidden'";
// foto che non si carica: al suo posto un segnaposto con icona
function senzaFoto(img) { const s = document.createElement("span"); s.className = "segnaposto"; s.textContent = "✦"; img.replaceWith(s); }

function intervallo(q) {
  if (q === "oggi") return [OGGI, OGGI];
  if (q === "domani") return [piu(OGGI,1), piu(OGGI,1)];
  if (q === "weekend") {
    const g = OGGI.getDay();
    return [(g >= 1 && g <= 4) ? piu(OGGI, 5 - g) : OGGI, piu(OGGI, (7 - g) % 7)];
  }
  if (q === "tutto") return [OGGI, piu(OGGI, 3650)];
  return [OGGI, piu(OGGI, Number(q))];
}

// conCat=false serve a contare gli eventi di ogni categoria a parita' degli altri filtri
function passa(e, q, conCat = true, conTutto = true) {
  const [da, a] = intervallo(q);
  if (giorno(e.al) < da || giorno(e.dal) > a) return false;
  if (!conTutto) return true;
  const t = stato.testo.trim().toLowerCase();
  return e.distanza_km <= stato.raggio && (!conCat || !stato.categoria || e.categoria === stato.categoria) &&
    (!t || [e.titolo, e.sottotitolo, e.descrizione, e.citta, e.luogo, e.categoria].join(" ").toLowerCase().includes(t));
}

function nomeGiorno(d) {
  const diff = Math.round((d - OGGI) / 86400000);
  const lungo = breve(d, { weekday:"long", day:"numeric", month:"long" });
  if (diff === 0) return ["Oggi", lungo];
  if (diff === 1) return ["Domani", lungo];
  const s = d.toLocaleDateString("it-IT", { weekday:"long" });
  return [s.charAt(0).toUpperCase() + s.slice(1), breve(d, { day:"numeric", month:"long" })];
}

function periodo(e) {
  const f = (s, o) => giorno(s).toLocaleDateString("it-IT", o);
  if (e.dal === e.al) return f(e.dal, { weekday:"long", day:"numeric", month:"long" });
  if (giorno(e.dal) <= OGGI) return "In corso fino al " + f(e.al, { day:"numeric", month:"long", year:"numeric" });
  return "Dal " + f(e.dal, { day:"numeric", month:"long" }) + " al " + f(e.al, { day:"numeric", month:"long" });
}

const GIU = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>`;

function scheda(e) {
  const mappa = `https://www.google.com/maps/search/?api=1&query=${e.lat},${e.lng}`;
  const fino = e.dal === e.al ? "" : ` · fino al ${breve(giorno(e.al), { day:"numeric", month:"short" })}`;
  return `<article class="ev" data-id="${e._id}">
    <button aria-expanded="false">
      ${e.immagine ? `<img class="foto" loading="lazy" src="${esc(e.immagine)}" alt="" onerror="senzaFoto(this)">` : `<span class="segnaposto" aria-hidden="true">${icona(e.categoria)}</span>`}
      <div class="corpo">
        <div class="cat">${esc(e.categoria)}</div>
        <div class="tit">${esc(e.titolo)}</div>
        <div class="dove">${esc(e.citta || e.luogo)} · <b>${Math.round(e.distanza_km)} km</b>${e.orario && e.orario.length < 14 ? " · " + esc(e.orario) : ""}${fino}</div>
      </div>
    </button>
    <div class="dettagli">
      ${e.immagine ? `<img loading="lazy" src="${esc(e.immagine)}" alt="" onerror="this.remove()">` : ""}
      ${e.sottotitolo ? `<p class="sott">${esc(e.sottotitolo)}</p>` : ""}
      ${e.descrizione ? `<p>${esc(e.descrizione)}</p>` : ""}
      <div class="info">
        <span>${esc(periodo(e))}</span>
        ${e.orario ? `<span>${esc(e.orario)}</span>` : ""}
        ${e.luogo ? `<span>${esc(e.luogo)}</span>` : ""}
        ${e.ingresso ? `<span>${esc(e.ingresso)}</span>` : ""}
        <span>Fonte: ${esc(e.fonte)}</span>
      </div>
      <div class="azioni">
        ${e.link ? `<a class="pillola piena" href="${esc(e.link)}" target="_blank" rel="noopener">Dettagli &rarr;</a>` : ""}
        <a class="pillola verde" href="${mappa}" target="_blank" rel="noopener">Come arrivare &rarr;</a>
      </div>
    </div>
  </article>`;
}

function grande(e, d) {
  return `<button class="grande" data-vai="${e._id}" data-giornovai="${iso(d)}">
    <div class="img"><img loading="lazy" src="${esc(e.immagine)}" alt="" onerror="${NASCONDI}"><span class="pillola tag">${esc(e.categoria)}</span></div>
    <div class="testo">
      <div class="quando">${esc(nomeGiorno(d)[0])} · ${esc(breve(d, { day:"numeric", month:"short" }))}</div>
      <h3>${esc(e.titolo)}</h3>
      <div class="dove">${esc(e.citta)} · ${Math.round(e.distanza_km)} km</div>
    </div>
  </button>`;
}

function anteprime(lista) {
  const conFoto = lista.filter(e => e.immagine).slice(0, 3);
  const resto = lista.length - conFoto.length;
  return `<div class="anteprime" aria-hidden="true">${conFoto.map(e => `<img loading="lazy" src="${esc(e.immagine)}" alt="" onerror="this.remove()">`).join("")}${resto > 0 ? `<span>+${resto}</span>` : ""}</div>`;
}

function disegna() {
  const ok = DATI.eventi.filter(e => passa(e, stato.quando));
  const [da] = intervallo(stato.quando);
  const brevi = ok.filter(e => !e.lungo), lunghi = ok.filter(e => e.lungo);
  const primo = e => giorno(e.dal) < da ? da : giorno(e.dal);

  const scelti = brevi.filter(e => e.immagine)
    .sort((x, y) => (primo(x) - primo(y)) || (x.distanza_km - y.distanza_km)).slice(0, 8);
  let html = scelti.length >= 2 ? `<section><span class="etichetta">In evidenza</span><h2>Da non perdere</h2>
    <div class="scorri">${scelti.map(e => grande(e, primo(e))).join("")}</div></section>` : "";

  // per il calendario: ogni appuntamento compare in tutti i giorni in cui si svolge
  const [, fine] = intervallo(stato.quando);
  PERGIORNO = new Map();
  brevi.forEach(e => {
    for (let d = primo(e); d <= giorno(e.al) && d <= fine; d = piu(d, 1)) {
      const k = iso(d);
      if (!PERGIORNO.has(k)) PERGIORNO.set(k, []);
      PERGIORNO.get(k).push(e);
    }
  });
  const chiavi = [...PERGIORNO.keys()].sort();
  if (!PERGIORNO.has(stato.scelto)) stato.scelto = chiavi[0] || null;
  if (stato.scelto && (!stato.mese || !stessoMese(stato.mese, giorno(stato.scelto)))) stato.mese = inizioMese(giorno(stato.scelto));
  if (chiavi.length) html += `<section><span class="etichetta">Calendario</span><h2>Giorno per giorno</h2><div id="cal"></div></section>`;

  if (lunghi.length) {
    lunghi.sort((x, y) => x.distanza_km - y.distanza_km);
    html += `<details class="lunghi"><summary><div><span class="etichetta">Sempre aperti</span>
      <h2>Mostre ed eventi lunghi · ${lunghi.length}</h2></div><span class="apri" aria-hidden="true">${GIU}</span></summary>
      <div class="contenuto">${lunghi.map(scheda).join("")}</div></details>`;
  }
  document.getElementById("lista").innerHTML = html ||
    `<div class="vuoto"><span class="etichetta">Niente in vista</span><h2>Nessun evento con questi filtri</h2>Prova ad allargare la distanza o il periodo.</div>`;
  if (document.getElementById("cal")) disegnaCal();
}

/* ---------- calendario ---------- */
let PERGIORNO = new Map();
const inizioMese = d => new Date(d.getFullYear(), d.getMonth(), 1);
const stessoMese = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth();

function disegnaCal() {
  const chiavi = [...PERGIORNO.keys()].sort();
  const primoM = inizioMese(giorno(chiavi[0])), ultimoM = inizioMese(giorno(chiavi[chiavi.length - 1]));
  const m = stato.mese, anno = m.getFullYear(), mese = m.getMonth();
  const vuoti = (m.getDay() + 6) % 7;                      // settimana che parte da lunedi'
  const giorniMese = new Date(anno, mese + 1, 0).getDate();
  let celle = "";
  for (let i = 0; i < vuoti; i++) celle += `<span class="cella fuori"></span>`;
  for (let g = 1; g <= giorniMese; g++) {
    const d = new Date(anno, mese, g), k = iso(d), n = (PERGIORNO.get(k) || []).length;
    const cl = ["cella", n ? "con" : "vuota", k === iso(OGGI) ? "oggi" : "", k === stato.scelto ? "scelta" : ""].join(" ");
    celle += n ? `<button class="${cl}" data-giorno="${k}" aria-label="${g}, ${n} eventi" aria-pressed="${k === stato.scelto}"><b>${g}</b><i>${n}</i></button>`
               : `<span class="${cl}"><b>${g}</b></span>`;
  }
  const nomeMese = m.toLocaleDateString("it-IT", { month:"long", year:"numeric" });
  const lista = (PERGIORNO.get(stato.scelto) || []).slice().sort((x, y) => x.distanza_km - y.distanza_km);
  const [nome, data] = stato.scelto ? nomeGiorno(giorno(stato.scelto)) : ["", ""];
  document.getElementById("cal").innerHTML = `
    <div class="cal">
      <div class="cal-testa">
        <button class="cal-freccia" data-mese="-1" aria-label="Mese precedente" ${m <= primoM ? "disabled" : ""}>&lsaquo;</button>
        <h3>${nomeMese}</h3>
        <button class="cal-freccia" data-mese="1" aria-label="Mese successivo" ${m >= ultimoM ? "disabled" : ""}>&rsaquo;</button>
      </div>
      <div class="cal-griglia">${["lun","mar","mer","gio","ven","sab","dom"].map(x => `<span class="cal-sett">${x}</span>`).join("")}${celle}</div>
    </div>
    ${stato.scelto ? `<div class="scelto-testa"><h3>${nome}</h3><span class="etichetta">${data} · ${lista.length} ${lista.length === 1 ? "evento" : "eventi"}</span></div>
    <div class="contenuto">${lista.map(scheda).join("")}</div>` : ""}`;
}

/* ---------- menu a tendina ---------- */
function chiudiPannelli(tranne) {
  [["t-quando","p-quando"],["t-cat","p-cat"]].forEach(([t, p]) => {
    if (p === tranne) return;
    document.getElementById(p).classList.remove("aperto");
    document.getElementById(t).setAttribute("aria-expanded", "false");
  });
}

function riempiQuando() {
  document.getElementById("p-quando").innerHTML = QUANDO.map(([v, t, ic]) => {
    const n = DATI.eventi.filter(e => !e.lungo && passa(e, v)).length;
    return `<button class="voce" role="option" data-quando="${v}" aria-selected="${v === stato.quando}">
      <span class="ic" aria-hidden="true">${ic}</span>${t}<span class="n">${n}</span></button>`;
  }).join("");
  document.getElementById("v-quando").textContent = QUANDO.find(x => x[0] === stato.quando)[1].replace("Prossimi ", "").replace("Questo ", "");
  document.getElementById("t-quando").classList.toggle("attiva", stato.quando !== "30");
}

function riempiCategorie() {
  const conta = {};
  DATI.eventi.filter(e => passa(e, stato.quando, false)).forEach(e => conta[e.categoria] = (conta[e.categoria] || 0) + 1);
  const tot = Object.values(conta).reduce((a, b) => a + b, 0);
  const tutte = Object.keys(conta).sort((a, b) => conta[b] - conta[a]);
  if (stato.categoria && !conta[stato.categoria]) tutte.push(stato.categoria);
  document.getElementById("p-cat").innerHTML =
    `<button class="voce" role="option" data-cat="" aria-selected="${!stato.categoria}"><span class="ic" aria-hidden="true">✦</span>Tutte le categorie<span class="n">${tot}</span></button>` +
    tutte.map(k => `<button class="voce" role="option" data-cat="${esc(k)}" aria-selected="${k === stato.categoria}">
      <span class="ic" aria-hidden="true">${icona(k)}</span>${esc(k)}<span class="n">${conta[k] || 0}</span></button>`).join("");
  document.getElementById("v-cat").textContent = stato.categoria || "Tutte";
  document.getElementById("t-cat").classList.toggle("attiva", !!stato.categoria);
}

function aggiornaTutto() { riempiQuando(); riempiCategorie(); disegna(); }

function disegnaCerchi() {
  document.getElementById("anelli").innerHTML = RAGGI.map(r => {
    const rr = { 10:28, 25:52, 50:76, 100:100 }[r];   // scala leggibile, non proporzionale
    const sc = r === stato.raggio ? "scelto" : "";
    return `<circle class="anello ${sc}" r="${rr}" data-r="${r}"></circle><text class="${sc}" x="0" y="${rr + 11}" data-r="${r}">${r} km</text>`;
  }).join("") + `<circle r="3" fill="#e4405f"></circle>`;
  document.getElementById("dove-centro").textContent = `Parma · ${stato.raggio} km`;
}

document.addEventListener("click", ev => {
  const t = ev.target;
  const tend = t.closest(".tendina");
  if (tend) {
    const p = document.getElementById(tend.id === "t-quando" ? "p-quando" : "p-cat");
    const apri = !p.classList.contains("aperto");
    chiudiPannelli(p.id);
    p.classList.toggle("aperto", apri); tend.setAttribute("aria-expanded", apri);
    return;
  }
  const vq = t.closest("[data-quando]");
  if (vq) { stato.quando = vq.dataset.quando; chiudiPannelli(); aggiornaTutto(); return; }
  const vc = t.closest("[data-cat]");
  if (vc) { stato.categoria = vc.dataset.cat || null; chiudiPannelli(); aggiornaTutto(); return; }
  if (!t.closest(".pannello")) chiudiPannelli();

  if (t.closest("#t-cerca")) {
    const box = document.getElementById("box-cerca"), b = document.getElementById("t-cerca");
    const apri = !box.classList.contains("aperta");
    box.classList.toggle("aperta", apri); b.setAttribute("aria-expanded", apri);
    if (apri) document.getElementById("cerca").focus();
    return;
  }
  const r = t.closest("[data-r]");
  if (r) { stato.raggio = Number(r.dataset.r); disegnaCerchi(); aggiornaTutto(); return; }
  const q = t.closest(".numeri [data-q]");
  if (q) { stato.quando = q.dataset.q; aggiornaTutto(); document.getElementById("barra").scrollIntoView({ behavior:"smooth" }); return; }
  const gg = t.closest("[data-giorno]");
  if (gg) { stato.scelto = gg.dataset.giorno; disegnaCal(); return; }
  const fm = t.closest("[data-mese]");
  if (fm) {
    const m = new Date(stato.mese); m.setMonth(m.getMonth() + Number(fm.dataset.mese)); stato.mese = m;
    const k = [...PERGIORNO.keys()].sort().find(x => stessoMese(giorno(x), m));
    if (k) stato.scelto = k;
    disegnaCal(); return;
  }
  const g = t.closest("[data-vai]");
  if (g) {
    stato.scelto = g.dataset.giornovai; stato.mese = inizioMese(giorno(stato.scelto)); disegnaCal();
    const art = document.querySelector(`#cal .ev[data-id="${g.dataset.vai}"]`);
    if (art) { art.classList.add("aperta"); art.scrollIntoView({ behavior:"smooth", block:"center" }); }
    return;
  }
  const b = t.closest(".ev > button");
  if (b) { const a = b.parentElement; a.classList.toggle("aperta"); b.setAttribute("aria-expanded", a.classList.contains("aperta")); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") chiudiPannelli(); });

async function avvia() {
  try {
    DATI = await (await fetch("eventi.json", { cache:"no-cache" })).json();
  } catch {
    document.getElementById("info").textContent = "Impossibile caricare gli eventi. Controlla la connessione.";
    return;
  }
  DATI.eventi.forEach((e, i) => e._id = "e" + i);
  document.getElementById("info").textContent = `Aggiornato il ${DATI.aggiornato}`;
  const conta = q => DATI.eventi.filter(e => !e.lungo && passa(e, q, true, false)).length;
  document.getElementById("n-oggi").textContent = conta("oggi");
  document.getElementById("n-weekend").textContent = conta("weekend");
  document.getElementById("n-mese").textContent = conta("30");
  document.getElementById("piede").textContent = "Fonti: " +
    Object.keys(DATI.fonti).filter(k => typeof DATI.fonti[k] === "number" && DATI.fonti[k] > 0).join(", ") +
    ". Date e orari possono cambiare: controlla sempre sul sito dell'organizzatore.";
  document.getElementById("cerca").oninput = e => {
    stato.testo = e.target.value;
    document.getElementById("t-cerca").classList.toggle("attiva", !!stato.testo.trim());
    riempiCategorie(); disegna();
  };
  disegnaCerchi();
  aggiornaTutto();
}

/* ---------- sfondo: cristallizzazioni a gradini con riflessi iridescenti ---------- */
function cristalli() {
  let seme = 7;
  const caso = () => (seme = (seme * 16807) % 2147483647) / 2147483647;
  const W = innerWidth, H = Math.max(innerHeight, 700), M = Math.min(W, 900);
  // piu' giallo e oro, meno rosa: il rosa resta solo come accento in due combinazioni
  const PALETTE = [["#ffe14d","#ffb627","#43f0b5"], ["#fff07a","#3fe0c5","#5b8cff"],
                   ["#ffd23f","#7ee36b","#2ec4ff"], ["#ffb627","#ffe14d","#c86bff"],
                   ["#43f0b5","#ffe14d","#ff8a3d"], ["#5b8cff","#ffd23f","#ff6fa5"], ["#fff07a","#ff9f43","#7a5cff"]];
  const GRUPPI = [[1.0,.05,.44],[-.05,.34,.34],[1.04,.58,.3],[.0,.86,.38],[.9,.99,.3],[.5,-.06,.2],
                  [.12,.08,.2],[.96,.3,.18],[.08,.6,.16],[.4,.97,.2],[.78,.74,.15]];
  let defs = "", forme = "", id = 0;
  GRUPPI.forEach(([fx, fy, fs]) => {
    const cx = fx * W, cy = fy * H, base = fs * M;
    const grani = 3 + Math.floor(caso() * 3);
    for (let g = 0; g < grani; g++) {
      const pal = PALETTE[Math.floor(caso() * PALETTE.length)];
      const lato = base * (0.45 + caso() * 0.55);
      const x = cx + (caso() - .5) * base * 0.9, y = cy + (caso() - .5) * base * 0.9;
      const rot = Math.floor(caso() * 90) - 45;
      const gid = "g" + (id++);
      defs += `<linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${pal[0]}"/><stop offset=".5" stop-color="${pal[1]}"/><stop offset="1" stop-color="${pal[2]}"/></linearGradient>`;
      const passi = 6 + Math.floor(caso() * 4);
      let quadri = "";
      for (let i = 0; i < passi; i++) {        // quadrati annidati che rientrano a gradini, come nel bismuto
        const s = lato * (1 - i / (passi + 1)), sp = i * lato * 0.028;
        quadri += `<rect x="${(-s/2 + sp).toFixed(1)}" y="${(-s/2 + sp*0.7).toFixed(1)}" width="${s.toFixed(1)}" height="${s.toFixed(1)}" rx="1.5" fill="url(#${gid})" fill-opacity="${i === 0 ? .16 : .06}" stroke="url(#${gid})" stroke-width="${(2.2 - i*0.14).toFixed(2)}" stroke-linejoin="miter"/>`;
      }
      forme += `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) rotate(${rot})">${quadri}</g>`;
    }
  });
  let svg = document.getElementById("cristalli");
  if (!svg) { svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.id = "cristalli"; svg.setAttribute("aria-hidden", "true"); document.body.prepend(svg); }
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid slice");
  svg.innerHTML = `<defs>${defs}<filter id="luce"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g filter="url(#luce)">${forme}</g>`;
}
cristalli();
let larghezza = innerWidth;
addEventListener("resize", () => { if (Math.abs(innerWidth - larghezza) > 60) { larghezza = innerWidth; cristalli(); } });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
avvia();
</script>
